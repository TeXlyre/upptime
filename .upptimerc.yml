owner: texlyre
repo: upptime
user-agent: texlyre
assignees:
  - fabawi
  
sites:
  - name: TeXlyre Home Page (GitHub Pages redirect)
    url: https://texlyre.org/
    icon: https://texlyre.github.io/img/logo.svg
    slug: texlyre-org
    maxResponseTime: 5000
 
  - name: TeXlyre App (GitHub Pages)
    url: https://texlyre.github.io/texlyre/
    slug: texlyre-app
    maxResponseTime: 5000
  
  - name: Templates API (GitHub Pages)
    url: https://texlyre.github.io/texlyre-templates/api/templates.json
    slug: templates-api
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  
  - name: Chelys Recipes (GitHub Pages)
    url: https://texlyre.github.io/chelys-recipes
    slug: chelys-recipes
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: TeX Live Endpoint
    url: https://texlive.texlyre.org/pdftex/26/article.cls
    slug: texlive
    method: HEAD
    expectedStatusCodes:
      - 200
    maxResponseTime: 10000
  
  - name: BusyTeX Endpoint (TeX Live 2026)
    url: https://texlive2026.texlyre.org/26/article.cls
    slug: texlive2026
    method: HEAD
    expectedStatusCodes:
      - 200
    maxResponseTime: 10000

  - name: Repository Proxy
    url: https://proxy.texlyre.org/?url=https%3A%2F%2Fgithub.com%2Frobots.txt
    slug: repository-proxy
    headers:
      - "User-Agent: Upptime (+https://texlyre.org/upptime)"
      - "Origin: https://texlyre.org"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "User-agent"
    maxResponseTime: 10000
  
  - name: File Sync (FilePizza)
    url: https://filepizza.texlyre.org/
    slug: filepizza
    maxResponseTime: 8000
  
  - name: File Sync Signaling (FilePizza-PeerJS)
    url: https://peerjs.texlyre.org/texlyre
    slug: filepizza-signaling
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"name":"PeerJS Server"'
    maxResponseTime: 8000

  - name: Collaboration Signaling (y-webrtc)
    url: https://ywebrtc.texlyre.org/
    slug: ywebrtc-signaling
    expectedStatusCodes:
      - 200
    maxResponseTime: 8000

status-website:
  baseUrl: /upptime
  name: TeXlyre Status
  introTitle: TeXlyre Status
  introMessage: Uptime and response times for texlyre.org and its hosted services.
  logoUrl: https://texlyre.github.io/img/logo.svg
  favicon: https://texlyre.github.io/img/favicon.ico
  themeColor: "#ffffff"
  navbar:
    - title: Status
      href: /
    - title: TeXlyre
      href: https://texlyre.org
    - title: GitHub
      href: https://github.com/texlyre

delay: 2000

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updates: "0 3 * * *"
  updateTemplate: "0 0 * * 0"
  uptime: "*/5 * * * *"

commitMessages:
  readmeContent: ":pencil: Update summary in README [skip ci] [upptime]"
  summaryJson: ":card_file_box: Update status summary [skip ci] [upptime]"
  statusChange: "$EMOJI $SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [skip ci] [upptime]"
  graphsUpdate: ":bento: Update graphs [skip ci] [upptime]"
