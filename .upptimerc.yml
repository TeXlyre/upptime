owner: texlyre
repo: upptime

sites:
  - name: TeXlyre Home Page (GitHub Pages redirect)
    url: https://texlyre.org/
    icon: https://texlyre.org/assets/images/TeXlyre_notext_192.png
    slug: texlyre-app
    maxResponseTime: 5000

  - name: TeXlyre App (GitHub Pages)
    url: https://texlyre.github.io/texlyre/
    slug: texlyre-pages
    maxResponseTime: 5000

  - name: Templates API (GitHub Pages)
    url: https://texlyre.github.io/texlyre-templates/api/templates.json
    slug: templates-api
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: Chelys Recipes (GitHub Pages)
    url: https://texlyre.github.io/chelys-recipes
    slug: chelys-recipes
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    
  - name: TeX Live Endpoint
    url: https://texlive.texlyre.org/
    slug: texlive
    expectedStatusCodes:
      - 200
      - 301
      - 302
      - 403
      - 404
    maxResponseTime: 10000

  - name: BusyTeX Endpoint (TeX Live 2026)
    url: https://texlive2026.texlyre.org/
    slug: texlive2026
    expectedStatusCodes:
      - 200
      - 301
      - 302
      - 403
      - 404
    maxResponseTime: 10000
    
  - name: Repository Proxy
    url: https://proxy.texlyre.org/?url=https%3A%2F%2Ftexlyre.org%2F
    slug: repository-proxy
    expectedStatusCodes:
      - 200
    maxResponseTime: 10000

  - name: File Sync (FilePizza)
    url: https://filepizza.texlyre.org/
    slug: filepizza
    maxResponseTime: 8000

  - name: File Sync Signaling (FilePizza-PeerJs)
    url: https://peerjs.texlyre.org/
    slug: filepizza
    maxResponseTime: 8000
    
  - name: Collaboration Signaling (y-webrtc)
    url: wss://ywebrtc.texlyre.org
    check: ws
    slug: ywebrtc-signaling
    maxResponseTime: 8000

  - name: Typst (external dependency)
    url: https://typst.org/
    slug: typst
    maxResponseTime: 8000

status-website:
  cname: status.texlyre.org
  name: TeXlyre Status
  introTitle: TeXlyre Status
  introMessage: Uptime and response times for texlyre.org and its hosted services.
  logoUrl: https://texlyre.org/assets/images/TeXlyre_notext_192.png
  favicon: https://texlyre.org/favicon.ico
  themeColor: "#ffffff"
  navbar:
    - title: Status
      href: /
    - title: TeXlyre
      href: https://texlyre.org
    - title: GitHub
      href: https://github.com/texlyre

assignees:
  - texlyre

delay: 5

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updates: "0 3 * * *"
  updateTemplate: "0 0 * * 0"
  uptime: "*/5 * * * *"

commitMessages:
  readmeContent: "$prettyUrl is $status ($responseTime ms response time)"
  summaryContent: ":bento: Update summary in README [skip ci] [upptime]"
  statusChange: "$emoji $prettyUrl is $status ($responseTime ms)"
  graphsUpdate: ":bento: Update graphs [skip ci] [upptime]"
